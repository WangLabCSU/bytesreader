[package]
name = "decen"
version = "0.2.0"
authors = ["Yun Peng <pengyun.me@outlook.com>"]
edition = "2024"
description = "A decoder and encoder (decen) framework for byte streams"
license = "MIT"
readme = "README.md"
repository = "https://github.com/WangLabCSU/decen"
keywords = ["codec", "framing", "io", "buffer", "zero-copy"]
categories = ["encoding"]
exclude = ["/AGENTS.md", "/.github/", "/.gitignore", "/rust-toolchain.toml"]

[features]
nightly = []
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]

[dependencies]
bytes = "1.12.*"
hotpath = "0.30.3"

[dev-dependencies]
memchr = "2.8"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"

[profile.profiling]
inherits = "release"
debug = true
strip = false

[[bench]]
name = "read"
harness = false

[[bench]]
name = "write"
harness = false
