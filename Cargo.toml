[package]
name = "bytesreader"
version = "0.0.1"
authors = ["Yun Peng <pengyun.me@outlook.com>"]
edition = "2024"
description = "A growable buffered reader backed by the bytes crate"
license = "MIT"
readme = "README.md"
repository = "https://github.com/WangLabCSU/bytesreader"
keywords = ["io", "buffer", "reader", "bytes", "zero-copy"]
categories = ["parsing"]
exclude = ["/AGENTS.md", "/.github/", "/.gitignore", "/rust-toolchain.toml"]

[features]
nightly = []
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]

[dependencies]
bytes = "1.12.*"
hotpath = "0.30.*"

[dev-dependencies]
memchr = "2.8"

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"

[profile.profiling]
inherits = "release"
debug = true
strip = false

[[bench]]
name = "methods"
harness = false

[[bench]]
name = "reading"
harness = false
